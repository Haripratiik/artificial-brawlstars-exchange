[project]
name = "artificial-brawlstars-exchange"
version = "0.0.1"
description = "A deterministic multi-agent electronic market simulator for studying market microstructure, information aggregation, and event-linked derivatives."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# The settlement core deliberately has no runtime dependencies. It is the layer
# every research claim rests on, so it should be readable and auditable without
# a scientific stack in the way. Numerics arrive with the research layer.
dependencies = []

[project.optional-dependencies]
collect = [
  "httpx>=0.27",
]
dashboard = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "websockets>=12.0",
]
research = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/arena"]

[tool.pytest.ini_options]
# "." so that tests/ is importable as a package and helpers can be shared
# between test modules without smuggling them through fixtures.
pythonpath = ["python", "."]
testpaths = ["tests"]
# Repo-local basetemp: the system temp directory is not always writable by the
# test runner, and a dedicated directory keeps tmp_path behaviour identical
# across machines. pytest prunes it automatically, keeping the last few runs.
addopts = "-q --strict-markers --basetemp=.pytest_tmp"
# Declared because --strict-markers is on. "slow" means a test whose cost is
# measured in minutes, not seconds. Nothing is skipped by default: a local
# `pytest` still runs everything, so the count in the README stays the whole
# count. The marker exists so CI can run a fast gate on every push and the
# full suite on a schedule, rather than making every push wait an hour and
# quietly training everyone to ignore it.
markers = [
    "slow: takes minutes. Excluded from the per-push CI gate, run nightly.",
]

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["python", "collectors", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "python"
strict = true
warn_unreachable = true
