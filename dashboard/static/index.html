<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena Markets</title>
  <link rel="stylesheet" href="/static/css/terminal.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2308080a'/><rect x='3' y='3' width='10' height='10' fill='%23f5a623'/></svg>">
</head>
<body>
  <div id="shell">
    <header>
      <div class="brand"><em>&#9646;</em> ARENA <small>Markets</small></div>

      <div class="stat"><b id="clock">0.00s</b><span>session</span></div>
      <div class="stat"><b id="events">0</b><span>events</span></div>
      <div class="stat"><b id="equity">&mdash;</b><span>equity</span></div>
      <div class="stat"><b id="pnl">&mdash;</b><span>p&amp;l</span></div>

      <div class="spacer"></div>

      <div class="speed">
        <span class="faint mono" style="font-size:8.5px;letter-spacing:.14em">SPEED</span>
        <input id="speed" type="range" min="0" max="20" step="0.5" value="1">
        <b id="speed-label">1.0&times;</b>
      </div>

      <div class="health" id="health"><i></i><span id="health-text">conserved</span></div>
    </header>

    <nav>
      <div class="nav-links" id="nav">
        <button data-view="markets" aria-current="true">Markets</button>
        <button data-view="trade">Trade</button>
        <button data-view="portfolio">Portfolio</button>
        <button data-view="research">Research</button>
        <button data-view="lab">Lab</button>
      </div>
      <div class="watch-head">Instruments</div>
      <div class="watchlist" id="watchlist"></div>
    </nav>

    <main id="main"></main>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
